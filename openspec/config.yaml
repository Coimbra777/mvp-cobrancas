schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## Produto
  Caderneta: sistema web para o Dario controlar empréstimos informais a amigos e parentes.
  Escala: ~50 clientes, ~50 parcelas/mês, UM único usuário (o Dario). Sem multiusuário, sem cadastro público.

  ## Arquitetura
  - UM único app Laravel na raiz do repositório, com front-end em Vue 3 + TypeScript via Inertia.js.
  - Produção: hospedagem compartilhada Hostinger Single (PHP + MySQL + cron, SEM Node). Assets compilados
    localmente/CI com Vite (`npm run build`) em `public/build`; sobem no deploy, nunca ficam no git.
  - Autenticação: sessão padrão do Laravel, um único usuário. Sem API pública além do webhook do Asaas.
  - Rotas fora do Inertia: POST /webhooks/asaas (fora do CSRF) e a página pública /p/{token} (sem login).
  - Agendamento: scheduler do Laravel com uma única linha de cron documentada.
  - O repositório nasceu do boilerplate Laravel 10 (sem correções de segurança). Atualização só com aprovação.

  ## Escopo atual: MVP de validação com o cliente (o mais simples possível)
  1. Login do usuário único.
  2. Clientes: listar e cadastrar (nome, telefone).
  3. Empréstimos: cliente, valor, taxa mensal, método (simples | composto), nº de parcelas, 1º vencimento.
     Ao salvar, gera as parcelas. Página do empréstimo lista as parcelas.
  4. Cobranças: parcelas em aberto (filtro atrasadas / a vencer), botão "Dar baixa" (paga hoje, sem parcial)
     e botão "Enviar no WhatsApp" (wa.me com nome, parcela, valor, vencimento e link /p/{token}).
  5. Fase 2 mantida: QR Code Pix ESTÁTICO do Asaas (cobrancas:gerar diário, janela de 5 dias,
     allowsMultiplePayments=false, externalReference `cobranca_pix:{id}`, expiração no fim do dia), troca de
     QR Code da parcela atrasada ao abrir /p/{token} (valor original), webhook POST /webhooks/asaas (valida
     `asaas-access-token`, idempotência pelo id do evento e pelo id do pagamento, baixa pelo pixQrCodeId,
     `value` recebido e `netValue` guardados; falha responde 500 para o Asaas reenviar).
  Fora do escopo: lembretes/consentimento/fila, juros de atraso, pagamento parcial, renegociação, Pix direto,
  tabela de configurações (usar .env), backup automático, painel com indicadores, seletor de tema, Vitest.
  Não copiar código do projeto antigo de integração (projeto-A).

  ## Regras de negócio
  - Dinheiro SEMPRE em centavos inteiros. Datas em America/Fortaleza.
  - Cálculo: simples = principal × (1 + i×n); composto = principal × (1+i)^n; total arredondado UMA vez,
    dividido em parcelas iguais, diferença de centavos na última.
  - Vencimentos no mesmo dia dos meses seguintes, sempre a partir do 1º vencimento, sem estouro em 29–31
    (usa o último dia do mês).
  - Asaas recebe só o valor final da parcela. Nunca enviar fine/interest.
  - Situações da parcela: aberta | paga (atrasada e a vencer são calculadas pelo vencimento).

  ## Não funcionais
  - pt-BR na interface. Acessibilidade básica (labels, foco visível, contraste, status não só por cor).
  - Responsivo, celular primeiro. Tema escuro automático pelo sistema operacional.
  - Segredos só no .env; .env.example só com placeholders.
  - Testes PHPUnit só para: cálculo das parcelas (simples e composto) e webhook (token, idempotência, baixa).
    Front: só vue-tsc no build.

  ## Convenções
  - Laravel padrão: models, form requests, controllers enxutos. Services só para o cálculo das parcelas e o Asaas.
  - Back: nomes de domínio em português (models, tabelas, colunas, comandos), como na Fase 2.
  - Front: páginas Inertia em `resources/js/pages`, layouts em `resources/js/layouts`, componentes em
    `resources/js/components` (minúsculas, padrão do Inertia 3), poucos componentes; TypeScript ~6.0 (vue-tsc);
    textos de interface em pt-BR.
  - Git: uma branch por change (`change/<nome>`), commits pequenos em português no imperativo, PR para `main`
    com revisão antes do merge; `/opsx:archive` no mesmo PR. Sem push forçado na `main`, sem arquivos compilados.
  - Referência visual: imagem de layout fornecida pelo usuário (sidebar, cards, selos de status,
    botões amarelo e verde-petróleo).

rules:
  proposal:
    - Sempre declarar o que está fora do escopo.
  tasks:
    - Tarefas pequenas e verificáveis, cada uma com um critério de pronto observável.
    - Agrupar tarefas de forma que cada grupo vire um ou poucos commits pequenos.
